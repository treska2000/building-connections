# Validation thresholds and flags. All tuning lives here, not in code.
version: 2.4.0
seed: 42

# R6 embedder: Qwen3, Matryoshka dim. model_snapshot pins weights for reproducibility.
embedder: { model: qwen3, dim: 64, task: "sentence similarity", model_snapshot: null }
openalex_snapshot: null

# Requirements that block the verdict; everything else is computed but non-blocking.
required_gates: [R1, R3, R5]

thresholds:
  R1: { min_terms: 16, min_base_tags: 4, min_tag_size: 4, min_share_3sources: 0.90 }          # Volume
  R3: { min_sane_sources_per_term: 1, min_share_sane: 0.90, min_share_attested: 0.90,         # Sources
        min_independent_groups: 3, citations_hi: 100 }
  R5: { area_consistency_tau: 0.70 }                                                          # Specialization
  R4: { min_vpy: 0.70, min_vpy_mode2: null, min_vpy_mode3: null, n_samples: 400, seed: 42 }   # Solvability (parked)
  R6: { tau_v_measure: 0.50, k_tolerance: 2, tau_margin: 0.10, tau_margin_share: 0.70,        # Semantic coherence
        linkage: ward, k_min: 2, k_max: 16, text_mode: label_desc }

# Auto-degraders for the functional test (configs degraded in-memory, never committed).
degraders:
  operators: [pairflip, merge, distractor, truncate]
  intensity_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  seed: 42
  proximity: lexical          # lexical | embed
  distractor_bank: null
